# CI/CD workflow for Ev0
#
# Required GitHub Secrets (add under Settings → Secrets and variables → Actions):
#   SSH_PRIVATE_KEY   — contents of ~/.ssh/id_ed25519_new (the ed25519 key for root@VPS)
#   VPS_HOST          — 213.130.144.204
#
# Optional secret (tests are skipped without it):
#   DATABASE_URL      — postgres connection string if you want tests to run against a real DB

name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Backend lint (uv + ruff) ──────────────────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install backend dev dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Ruff lint (backend)
        working-directory: backend
        run: uv run ruff check .

      # ── Frontend lint (Next.js ESLint) ────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint (frontend)
        working-directory: frontend
        run: npm run lint

  # ── Backend tests ─────────────────────────────────────────────────────────
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    # Tests require DB access — run with continue-on-error so a missing
    # DATABASE_URL secret doesn't block the deploy.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install backend dev dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Run pytest
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Skip entirely when no DATABASE_URL secret is configured
        if: ${{ env.DATABASE_URL != '' }}
        run: uv run pytest tests/ -x -q

  # ── Deploy to VPS ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: lint
    # Only deploy on pushes to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # SSH into VPS: git pull latest main, docker cp into containers, restart
      - name: Deploy via SSH (git pull + docker cp)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -e

            REPO_DIR="/opt/ev0-repo"
            BACKEND_CONTAINER="ev0-compose-z5hvqt-backend-1"
            WORKER_CONTAINER="ev0-compose-z5hvqt-worker-1"

            # Ensure repo is cloned; pull latest
            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone https://github.com/GuillaumeBld/Ev0.git "$REPO_DIR"
            else
              git -C "$REPO_DIR" pull --ff-only origin main
            fi

            echo "==> Copying app/ into backend container"
            docker cp "$REPO_DIR/backend/app/." "$BACKEND_CONTAINER:/app/app/"

            echo "==> Copying app/ into worker container"
            docker cp "$REPO_DIR/backend/app/." "$WORKER_CONTAINER:/app/app/"

            echo "==> Restarting containers"
            docker restart "$BACKEND_CONTAINER" "$WORKER_CONTAINER"

            echo "==> Deploy complete"
