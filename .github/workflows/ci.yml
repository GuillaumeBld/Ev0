# CI/CD workflow for Ev0
#
# Required GitHub Secrets (add under Settings → Secrets and variables → Actions):
#   SSH_PRIVATE_KEY   — contents of ~/.ssh/id_ed25519_new (the ed25519 key for root@VPS)
#   VPS_HOST          — 213.130.144.204
#
# Optional secret (tests are skipped without it):
#   DATABASE_URL      — postgres connection string if you want tests to run against a real DB

name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Backend lint (uv + ruff) ──────────────────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install backend dev dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Ruff lint (backend)
        working-directory: backend
        run: uv run ruff check .

      # ── Frontend lint (Next.js ESLint) ────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint (frontend)
        working-directory: frontend
        run: npm run lint

  # ── Backend tests ─────────────────────────────────────────────────────────
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    # Tests require DB access — run with continue-on-error so a missing
    # DATABASE_URL secret doesn't block the deploy.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install backend dev dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Run pytest
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Skip entirely when no DATABASE_URL secret is configured
        if: ${{ env.DATABASE_URL != '' }}
        run: uv run pytest tests/ -x -q

  # ── Deploy to VPS ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: lint
    # Only deploy on pushes to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # Copy backend/app/ to VPS via SCP
      - name: Copy backend/app to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/app/"
          target: "/tmp/ev0-deploy/"
          strip_components: 1

      # SSH into VPS: docker cp files into containers, then restart
      - name: Deploy into containers via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            DEPLOY_SRC="/tmp/ev0-deploy/app"
            BACKEND_CONTAINER="ev0-compose-z5hvqt-backend-1"
            WORKER_CONTAINER="ev0-compose-z5hvqt-worker-1"

            echo "==> Copying app/ into backend container"
            docker cp "$DEPLOY_SRC/." "$BACKEND_CONTAINER:/app/app/"

            echo "==> Copying app/ into worker container"
            docker cp "$DEPLOY_SRC/." "$WORKER_CONTAINER:/app/app/"

            echo "==> Restarting backend container"
            docker restart "$BACKEND_CONTAINER"

            echo "==> Restarting worker container"
            docker restart "$WORKER_CONTAINER"

            echo "==> Cleaning up temp files"
            rm -rf /tmp/ev0-deploy

            echo "==> Deploy complete"
