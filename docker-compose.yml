version: '3.8'
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ev0
      POSTGRES_PASSWORD: secure_password_change_me
      POSTGRES_DB: ev0
    volumes:
      - ../files/postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ../files/redis_data:/data
    networks:
      - dokploy-network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ev0:secure_password_change_me@db:5432/ev0
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS_STR: "*"
      DEPLOY_VERSION: "2026-02-21-v2"
    depends_on:
      - db
      - redis
    command: sh -c "pip install -r requirements.txt 2>/dev/null; alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
        - dokploy-network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NEXTAUTH_SECRET: ev0-secret-key-2024
      NEXTAUTH_URL: http://ev0-compose-z5hvqt-a4f9a7-213-130-144-204.traefik.me
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ev0admin2024
    depends_on:
      - backend
    networks:
      - dokploy-network
networks:
  dokploy-network:
    external: true
