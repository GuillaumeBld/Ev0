version: '3.8'
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ev0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-ev0}
    volumes:
      - ../files/postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ../files/redis_data:/data
    networks:
      - dokploy-network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        CACHE_BUST: "2026-02-22-v15"
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ev0:secure_password_change_me@db:5432/ev0}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS_STR: ${CORS_ORIGINS_STR:-http://ev0-compose-z5hvqt-a4f9a7-213-130-144-204.traefik.me}
      ODDS_API_KEY: ${ODDS_API_KEY:-f23a202732591c8cb45f14ca0ee32c45}
      DEPLOY_VERSION: "2026-02-22-v15"
    depends_on:
      - db
      - redis
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
        - dokploy-network
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        CACHE_BUST: "2026-02-22-v15"
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ev0:secure_password_change_me@db:5432/ev0}
      REDIS_URL: redis://redis:6379/0
      ODDS_API_KEY: ${ODDS_API_KEY:-f23a202732591c8cb45f14ca0ee32c45}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
    depends_on:
      - db
      - redis
      - backend
    command: python -m app.worker
    networks:
      - dokploy-network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-ev0-secret-key-2024}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://ev0-compose-z5hvqt-a4f9a7-213-130-144-204.traefik.me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ev0admin2024}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - dokploy-network
networks:
  dokploy-network:
    external: true
