version: "3.8"
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in env}
      POSTGRES_DB: ${POSTGRES_DB:-ev0}
    volumes:
      - ../files/postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - ../files/redis_data:/data
    networks:
      - dokploy-network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        CACHE_BUST: 2026-05-01-v1
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS_STR: ${CORS_ORIGINS_STR:?Set CORS_ORIGINS_STR in env}
      ODDS_API_KEY: ${ODDS_API_KEY:?Set ODDS_API_KEY in env}
      BZZOIRO_API_KEY: ${BZZOIRO_API_KEY:-}
      DEPLOY_VERSION: 2026-02-22-v16
    depends_on:
      - db
      - redis
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - dokploy-network
    labels:
      - traefik.http.routers.ev0-compose-z5hvqt-4-web.rule=Host(`ev0-api-213-130-144-204.sslip.io`)
      - traefik.http.routers.ev0-compose-z5hvqt-4-web.entrypoints=web
      - traefik.http.services.ev0-compose-z5hvqt-4-web.loadbalancer.server.port=8000
      - traefik.http.routers.ev0-compose-z5hvqt-4-web.service=ev0-compose-z5hvqt-4-web
      - traefik.docker.network=dokploy-network
      - traefik.enable=true
      - traefik.http.routers.ev0-compose-z5hvqt-4-web.rule=Host(`ev0-api-213-130-144-204.sslip.io`)
      - traefik.http.routers.ev0-compose-z5hvqt-4-web.entrypoints=web
      - traefik.http.routers.ev0-compose-z5hvqt-4-web.middlewares=ev0-https-redirect
      - traefik.http.routers.ev0-compose-z5hvqt-4-websecure.rule=Host(`ev0-api-213-130-144-204.sslip.io`)
      - traefik.http.routers.ev0-compose-z5hvqt-4-websecure.entrypoints=websecure
      - traefik.http.routers.ev0-compose-z5hvqt-4-websecure.tls=true
      - traefik.http.routers.ev0-compose-z5hvqt-4-websecure.service=ev0-compose-z5hvqt-4-web
      - traefik.http.services.ev0-compose-z5hvqt-4-web.loadbalancer.server.port=8000
      - traefik.http.middlewares.ev0-https-redirect.redirectscheme.scheme=https
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        CACHE_BUST: 2026-05-01-v1
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ODDS_API_KEY: ${ODDS_API_KEY:?Set ODDS_API_KEY in env}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
    depends_on:
      - db
      - redis
      - backend
    command: python -m app.worker
    networks:
      - dokploy-network
  db-backup:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in env}
      PGDATABASE: ${POSTGRES_DB:-ev0}
    volumes:
      - ../files/db_backups:/backups
    depends_on:
      - db
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "DB backup service started. Running daily at 03:00 UTC."
        while true; do
          CURRENT_HOUR=$$(date -u +%H)
          CURRENT_MIN=$$(date -u +%M)
          if [ "$$CURRENT_HOUR" = "03" ] && [ "$$CURRENT_MIN" = "00" ]; then
            TIMESTAMP=$$(date -u +%Y%m%d_%H%M%S)
            echo "[$$TIMESTAMP] Starting backup..."
            pg_dump -Fc > /backups/ev0_$$TIMESTAMP.dump
            if [ $$? -eq 0 ]; then
              echo "[$$TIMESTAMP] Backup completed: ev0_$$TIMESTAMP.dump"
              # Keep only last 7 days of backups
              ls -t /backups/ev0_*.dump 2>/dev/null | tail -n +8 | xargs -r rm
              echo "Cleanup done. Kept last 7 backups."
            else
              echo "[$$TIMESTAMP] Backup FAILED!"
            fi
          fi
          sleep 60
        done
    networks:
      - dokploy-network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL in env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in env}
    depends_on:
      - backend
    networks:
      - dokploy-network
    labels:
      - traefik.http.routers.ev0-compose-z5hvqt-3-web.rule=Host(`ev0-213-130-144-204.sslip.io`)
      - traefik.http.routers.ev0-compose-z5hvqt-3-web.entrypoints=web
      - traefik.http.services.ev0-compose-z5hvqt-3-web.loadbalancer.server.port=3000
      - traefik.http.routers.ev0-compose-z5hvqt-3-web.service=ev0-compose-z5hvqt-3-web
      - traefik.docker.network=dokploy-network
      - traefik.enable=true
      - traefik.http.routers.ev0-compose-z5hvqt-3-web.rule=Host(`ev0-213-130-144-204.sslip.io`)
      - traefik.http.routers.ev0-compose-z5hvqt-3-web.entrypoints=web
      - traefik.http.routers.ev0-compose-z5hvqt-3-web.middlewares=ev0-https-redirect
      - traefik.http.routers.ev0-compose-z5hvqt-3-websecure.rule=Host(`ev0-213-130-144-204.sslip.io`)
      - traefik.http.routers.ev0-compose-z5hvqt-3-websecure.entrypoints=websecure
      - traefik.http.routers.ev0-compose-z5hvqt-3-websecure.tls=true
      - traefik.http.routers.ev0-compose-z5hvqt-3-websecure.service=ev0-compose-z5hvqt-3-web
      - traefik.http.services.ev0-compose-z5hvqt-3-web.loadbalancer.server.port=3000
      - traefik.http.middlewares.ev0-https-redirect.redirectscheme.scheme=https
networks:
  dokploy-network:
    external: true
